
name: Translator Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile native ARM64 runtime
        run: |
          cc -std=c11 -Wall -Wextra -Werror -D_DEFAULT_SOURCE \
            native/arm64_runtime.c native/test_arm64_runtime.c \
            -o /tmp/test_arm64_runtime
          /tmp/test_arm64_runtime
