plugins {
    id 'com.android.application'
}

android {
    namespace 'org.ps3translator.prototype'
    compileSdk 35

    defaultConfig {
        applicationId 'org.ps3translator.prototype'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-prototype'

        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
